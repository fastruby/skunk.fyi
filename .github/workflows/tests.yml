name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # webpack 4 uses the MD4 hash, which OpenSSL 3 (Node 17+) removed.
  # Required until webpacker is replaced.
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  test:
    name: test (${{ matrix.gemfile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        gemfile: [ Gemfile, Gemfile.next ]

    services:
      postgres:
        # Matches the production Postgres version.
        image: postgres:15.17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # The postgres image ships no healthcheck of its own.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v7

      - name: Install the PostgreSQL client
        run: sudo apt-get -yqq install libpq-dev

      # bundler-cache runs `bundle install` against BUNDLE_GEMFILE, so each boot
      # is resolved from its own committed lockfile and cached separately.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .tool-versions
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install

      - name: Set up the database
        run: |
          cp config/database.yml.github config/database.yml
          bin/rails db:setup

      - name: Compile packs
        run: bin/rails webpacker:compile

      # Same rubocop version in both lockfiles, so once is enough.
      - name: Lint
        if: matrix.gemfile == 'Gemfile'
        run: bundle exec rubocop

      - name: Run tests
        run: bin/rails test
